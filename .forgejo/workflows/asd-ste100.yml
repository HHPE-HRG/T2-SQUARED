name: asd-ste100

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Aggregate mode for a manual run
        required: true
        default: fixture
        type: choice
        options:
          - fixture
          - main
          - release
      tag:
        description: Protected t2-v* tag. Leave empty to create no tag.
        required: false
        type: string

concurrency:
  group: asd-ste100-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  packages: write
  pull-requests: read

env:
  PATH: /home/oldmac-vm/.local/node-v24/bin:/usr/local/bin:/usr/bin:/bin
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}

jobs:
  advisory:
    name: asd-ste100 / advisory
    runs-on: hhpe-ci
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - name: Checkout pull-request head for advisory extraction
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: token ${GITHUB_TOKEN}" fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
      - name: Advisory fixture command without credentials
        run: npm run ci:asd-ste100 -- --mode fixture

  trusted-pr:
    name: asd-ste100 / trusted-pr
    runs-on: t2-trusted
    if: github.repository == 'maxholden/T2-SQUARED' && github.event_name == 'pull_request'
    timeout-minutes: 30
    env:
      ASD_STE100_GITHUB_ACTIONS: disabled
      ASD_STE100_PR_TREE: ${{ github.workspace }}/pr-tree
      ASD_STE100_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ASD_STE100_VOCABULARY: ${{ secrets.ASD_STE100_VOCABULARY }}
    steps:
      - name: Prepare ephemeral empty workspace
        run: |
          rm -rf "${{ runner.temp }}/t2-trusted"
          mkdir -p "${{ runner.temp }}/t2-trusted"
      - name: Checkout protected merge-base checker
        run: |
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" checker
          git -C checker -c http.extraHeader="Authorization: token ${GITHUB_TOKEN}" fetch origin "${{ github.event.pull_request.base.sha }}"
          git -C checker checkout --force "${{ github.event.pull_request.base.sha }}"
      - name: Mount pull-request tree read-only as data
        run: |
          git clone --no-checkout "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" pr-tree
          git -C pr-tree -c http.extraHeader="Authorization: token ${GITHUB_TOKEN}" fetch origin "${{ github.event.pull_request.head.sha }}"
          git -C pr-tree checkout --force "${{ github.event.pull_request.head.sha }}"
          chmod -R go-w pr-tree || true
      - name: Gate PR from merge-base checker
        working-directory: checker
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['ci:asd-ste100'] ? 0 : 1)"; then
            echo "merge-base has no ci:asd-ste100; first-land bootstrap skip"
            exit 0
          fi
          npm run ci:asd-ste100 -- --mode pr
      - name: Gate work-registry from merge-base checker
        working-directory: checker
        run: |
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['ci:work-registry'] ? 0 : 1)"; then
            echo "merge-base has no ci:work-registry; first-land bootstrap skip"
            exit 0
          fi
          T2_WORK_REGISTRY_ROOT="${{ github.workspace }}/pr-tree" npm run ci:work-registry
      - name: Remove secret mounts
        if: always()
        run: |
          unset FORGEJO_TOKEN ASD_STE100_VOCABULARY ASD_STE100_GITHUB_ACTIONS
          chmod -R u+w pr-tree checker 2>/dev/null || true
          rm -rf "${{ runner.temp }}/t2-trusted"

  trusted-main:
    name: asd-ste100 / trusted-main
    runs-on: t2-trusted
    if: github.repository == 'maxholden/T2-SQUARED' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 40
    env:
      ASD_STE100_GITHUB_ACTIONS: disabled
      ASD_STE100_VOCABULARY: ${{ secrets.ASD_STE100_VOCABULARY }}
    steps:
      - name: Prepare ephemeral empty workspace
        run: |
          rm -rf "${{ runner.temp }}/t2-trusted"
          mkdir -p "${{ runner.temp }}/t2-trusted"
      - name: Checkout protected main
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: token ${GITHUB_TOKEN}" fetch origin main
          git checkout --force FETCH_HEAD
      - name: Full-corpus baseline
        run: npm run ci:asd-ste100 -- --mode main
      - name: Work-registry baseline
        run: npm run ci:work-registry
      - name: Remove secret mounts
        if: always()
        run: |
          unset FORGEJO_TOKEN PACKAGE_TOKEN ASD_STE100_VOCABULARY ASD_STE100_GITHUB_ACTIONS
          chmod -R u+w pr-tree checker 2>/dev/null || true
          rm -rf "${{ runner.temp }}/t2-trusted"

  trusted-release:
    name: asd-ste100 / trusted-release
    runs-on: t2-trusted
    if: github.repository == 'maxholden/T2-SQUARED' && github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
    permissions:
      contents: write
      packages: write
    timeout-minutes: 40
    env:
      ASD_STE100_GITHUB_ACTIONS: disabled
      ASD_STE100_VOCABULARY: ${{ secrets.ASD_STE100_VOCABULARY }}
    steps:
      - name: Prepare ephemeral empty workspace
        run: |
          rm -rf "${{ runner.temp }}/t2-trusted"
          mkdir -p "${{ runner.temp }}/t2-trusted"
      - name: Checkout attested main candidate
        run: |
          git init
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraHeader="Authorization: token ${GITHUB_TOKEN}" fetch origin main
          git checkout --force FETCH_HEAD
      - name: Release eligibility
        run: npm run ci:asd-ste100 -- --mode release
      - name: Work-registry release gate
        run: npm run ci:work-registry
      - name: Publish digest-addressed generic package
        run: |
          digest_file=$(ls .cache/asd-ste100/*.json | head -n 1)
          test -n "$digest_file"
          name=$(basename "$digest_file")
          # Fail when the same digest name already holds different bytes.
          curl -fsS -X PUT \
            -H "Authorization: token ${PACKAGE_TOKEN}" \
            --upload-file "$digest_file" \
            "${GITHUB_SERVER_URL}/api/packages/${GITHUB_REPOSITORY_OWNER}/generic/asd-ste100-attestation/${name}/${name}"
      - name: Create protected t2-v* tag only
        if: startsWith(inputs.tag, 't2-v')
        run: |
          git tag "${{ inputs.tag }}"
          git push origin "refs/tags/${{ inputs.tag }}"
      - name: Remove secret mounts
        if: always()
        run: |
          unset FORGEJO_TOKEN PACKAGE_TOKEN RELEASE_TOKEN ASD_STE100_VOCABULARY ASD_STE100_GITHUB_ACTIONS
          chmod -R u+w pr-tree checker 2>/dev/null || true
          rm -rf "${{ runner.temp }}/t2-trusted"
